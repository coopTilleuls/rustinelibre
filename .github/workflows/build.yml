name: Build

on:
  workflow_call:
    inputs:
      tags:
        type: string
        description: The Docker Tags (see docker/metadata-action@v4 for available values)
        required: true
    secrets:
      SCW_USERNAME:
        required: true
      SCW_SECRET_KEY:
        required: true

jobs:
  build-push-php:
    runs-on: ubuntu-latest
 
    steps:
    - name: Build/Push
      uses: coopTilleuls/action-docker-build-push@v10
      with:
        IMAGE_NAME: rustinelibre-php
        BUILD_CONTEXT: api
        BUILD_TARGET: app_php
        REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_REPOSITORY: ghcr.io/cooptilleuls

  # Push miroir vers le registry Scaleway, en plus du push ghcr.io ci-dessus, le temps des tests
  # de bascule vers le cluster Scaleway. Le flavor prefix (prod-/nonprod-) est indispensable :
  # l'ArgoCD Image Updater (opentofu-scaleway-infra-mut/2_environments/3_k8s_objects/
  # argocd_sites.tf, allowTags = "regexp:^${terraform.workspace}-") ne suit que les tags
  # "prod-sha-xxxxxxx"/"nonprod-sha-xxxxxxx".
  build-push-php-scaleway:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.5.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        registry: rg.fr-par.scw.cloud
        username: ${{ secrets.SCW_USERNAME }}
        password: ${{ secrets.SCW_SECRET_KEY }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: rg.fr-par.scw.cloud/infra-mut-cr-scw/rustinelibre
        tags: ${{ inputs.tags }}
        flavor: |
          prefix=${{ github.ref_type == 'tag' && 'prod-' || 'nonprod-' }},onlatest=true

    - name: Build/Push
      uses: docker/build-push-action@v6
      with:
        context: api
        target: app_php
        tags: ${{ steps.meta.outputs.tags }}
        push: true
        cache-from: |
          type=gha,scope=${{ github.ref }}-php
          type=gha,scope=refs/heads/main-php
        cache-to: |
          type=gha,scope=${{ github.ref }}-php,mode=max

  build-push-caddypreprod:
    # If it has no release tag, it's preprod
    if: ${{ github.ref_type != 'tag' }}
    # Same Dockerfile as php, with a build target which is after
    needs: [build-push-php]
    runs-on: ubuntu-latest

    steps:
    - name: Build/Push Preprod
      uses: coopTilleuls/action-docker-build-push@v10
      with:
        IMAGE_NAME: rustinelibre-caddy
        BUILD_CONTEXT: api
        BUILD_TARGET: app_caddypreprod
        REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_REPOSITORY: ghcr.io/cooptilleuls

  # Push miroir vers le registry Scaleway (voir le commentaire sur build-push-php-scaleway).
  build-push-caddypreprod-scaleway:
    # If it has no release tag, it's preprod
    if: ${{ github.ref_type != 'tag' }}
    needs: [build-push-php-scaleway]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.5.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        registry: rg.fr-par.scw.cloud
        username: ${{ secrets.SCW_USERNAME }}
        password: ${{ secrets.SCW_SECRET_KEY }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: rg.fr-par.scw.cloud/infra-mut-cr-scw/rustinelibre-caddy
        tags: ${{ inputs.tags }}
        flavor: |
          prefix=${{ github.ref_type == 'tag' && 'prod-' || 'nonprod-' }},onlatest=true

    - name: Build/Push Preprod
      uses: docker/build-push-action@v6
      with:
        context: api
        target: app_caddypreprod
        tags: ${{ steps.meta.outputs.tags }}
        push: true
        cache-from: |
          type=gha,scope=${{ github.ref }}-caddy
          type=gha,scope=refs/heads/main-caddy
        cache-to: |
          type=gha,scope=${{ github.ref }}-caddy,mode=max

  build-push-caddy:
    # If it has a release tag, it's prod
    if: ${{ github.ref_type == 'tag' }}
    # Same Dockerfile as php, with a build target which is after
    needs: [build-push-php]
    runs-on: ubuntu-latest

    steps:
    - name: Build/Push Prod
      uses: coopTilleuls/action-docker-build-push@v10
      with:
        IMAGE_NAME: rustinelibre-caddy
        BUILD_CONTEXT: api
        BUILD_TARGET: app_caddy
        REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_REPOSITORY: ghcr.io/cooptilleuls

  # Push miroir vers le registry Scaleway (voir le commentaire sur build-push-php-scaleway).
  build-push-caddy-scaleway:
    # If it has a release tag, it's prod
    if: ${{ github.ref_type == 'tag' }}
    needs: [build-push-php-scaleway]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.5.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        registry: rg.fr-par.scw.cloud
        username: ${{ secrets.SCW_USERNAME }}
        password: ${{ secrets.SCW_SECRET_KEY }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: rg.fr-par.scw.cloud/infra-mut-cr-scw/rustinelibre-caddy
        tags: ${{ inputs.tags }}
        flavor: |
          prefix=${{ github.ref_type == 'tag' && 'prod-' || 'nonprod-' }},onlatest=true

    - name: Build/Push Prod
      uses: docker/build-push-action@v6
      with:
        context: api
        target: app_caddy
        tags: ${{ steps.meta.outputs.tags }}
        push: true
        cache-from: |
          type=gha,scope=${{ github.ref }}-caddy
          type=gha,scope=refs/heads/main-caddy
        cache-to: |
          type=gha,scope=${{ github.ref }}-caddy,mode=max

  build-push-pwa:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3.5.2
    - name: Login to registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io/cooptilleuls
        username: _json_key
        password: ${{ secrets.GITHUB_TOKEN }} 
    - name: Define Env
      run: |       
        set -o pipefail
        if [[ "${{ github.ref }}" == *"tag"* ]]; then
            echo "SITE_KEY=${{ vars.PROD_CF_TURNSTILE_SITE_KEY }}" >> "$GITHUB_ENV"
        else
            echo "SITE_KEY=${{ vars.MAIN_CF_TURNSTILE_SITE_KEY }}" >> "$GITHUB_ENV"
        fi
    - name: Docker metadata
      id: docker-metadata
      uses: docker/metadata-action@v4
      with:
        images: ${{ vars.IMAGE_REPOSITORY_NAME }}/${{ vars.PWA_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ github.sha }},priority=9999
          ${{ inputs.tags }}

    - name: Build and push
      uses: docker/build-push-action@v4    
      with:
        context: pwa
        target: prod
        pull: true
        push: true
        tags: ${{ steps.docker-metadata.outputs.tags }}
        labels: ${{ steps.docker-metadata.outputs.labels }}
        build-args: |
          NEXT_PUBLIC_CF_TURNSTILE_SITE_KEY=${{ env.SITE_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.FB_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FB_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.FB_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.FB_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FB_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.FB_APP_ID }}
          NEXT_PUBLIC_VAPID_KEY=${{ vars.VAPID_KEY }}
        cache-from: type=registry,ref=${{ vars.IMAGE_REPOSITORY_NAME }}/${{ vars.PWA_IMAGE_NAME }}:buildcache

    # - name: Build/Push
    #   uses: coopTilleuls/action-docker-build-push@v10
    #   with:
    #     # BUILD_ARGS: NEXT_PUBLIC_CF_TURNSTILE_SITE_KEY=${{ env.SITE_KEY }}
    #     IMAGE_NAME: rustinelibre-pwa
    #     BUILD_CONTEXT: pwa
    #     BUILD_TARGET: prod
    #     REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
    #     IMAGE_REPOSITORY: ghcr.io/cooptilleuls

  # Push miroir vers le registry Scaleway (voir le commentaire sur build-push-php-scaleway).
  build-push-pwa-scaleway:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3.5.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        registry: rg.fr-par.scw.cloud
        username: ${{ secrets.SCW_USERNAME }}
        password: ${{ secrets.SCW_SECRET_KEY }}

    - name: Define Env
      run: |
        set -o pipefail
        if [[ "${{ github.ref }}" == *"tag"* ]]; then
            echo "SITE_KEY=${{ vars.PROD_CF_TURNSTILE_SITE_KEY }}" >> "$GITHUB_ENV"
        else
            echo "SITE_KEY=${{ vars.MAIN_CF_TURNSTILE_SITE_KEY }}" >> "$GITHUB_ENV"
        fi

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: rg.fr-par.scw.cloud/infra-mut-cr-scw/rustinelibre-pwa
        tags: ${{ inputs.tags }}
        flavor: |
          prefix=${{ github.ref_type == 'tag' && 'prod-' || 'nonprod-' }},onlatest=true

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: pwa
        target: prod
        pull: true
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NEXT_PUBLIC_CF_TURNSTILE_SITE_KEY=${{ env.SITE_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.FB_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FB_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.FB_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.FB_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FB_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.FB_APP_ID }}
          NEXT_PUBLIC_VAPID_KEY=${{ vars.VAPID_KEY }}
        cache-from: |
          type=gha,scope=${{ github.ref }}-pwa
          type=gha,scope=refs/heads/main-pwa
        cache-to: |
          type=gha,scope=${{ github.ref }}-pwa,mode=max
